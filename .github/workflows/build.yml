# Baut das Add-on für beide Architekturen und führt den Selbsttest aus.
name: Build und Selbsttest

on:
  push:
    branches: [main]
    paths: ["artcraft_mcp/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["artcraft_mcp/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            wait: 10
          - arch: aarch64
            platform: linux/arm64
            wait: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Bauen (${{ matrix.arch }})
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci \
            -t artcraft-mcp:test artcraft_mcp
      - name: Selbsttest (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e SELFTEST_WAIT=${{ matrix.wait }} \
            artcraft-mcp:test artcraft-selftest
